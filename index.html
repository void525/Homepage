<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Guquan YOU | Homepage</title>
  <meta name="description" content="Personal homepage for Guquan YOU, including name and email contact information." />
  <style>
    :root {
      --bg: #f7f4ef;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --accent: #8b1e1e;
      --border: #eadfd3;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top left, #fff7ed 0, transparent 34%), var(--bg);
      color: var(--text);
      padding: 24px;
    }

    main {
      width: min(100%, 720px);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 28px;
      box-shadow: 0 24px 80px rgba(31, 41, 55, 0.12);
      padding: clamp(32px, 7vw, 64px);
    }

    .eyebrow {
      margin: 0 0 16px;
      color: var(--accent);
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.4rem, 8vw, 5rem);
      line-height: 0.95;
      letter-spacing: -0.06em;
    }

    .subtitle {
      margin: 22px 0 0;
      max-width: 52ch;
      color: var(--muted);
      font-size: clamp(1rem, 2.5vw, 1.18rem);
      line-height: 1.7;
    }

    .contact-card {
      margin-top: 36px;
      padding: 22px;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: #fffaf5;
    }

    .label {
      margin: 0 0 8px;
      color: var(--muted);
      font-size: 0.9rem;
      font-weight: 600;
    }

    a {
      color: var(--accent);
      font-size: clamp(1.05rem, 3vw, 1.3rem);
      font-weight: 700;
      text-decoration: none;
      overflow-wrap: anywhere;
    }

    a:hover {
      text-decoration: underline;
    }

    footer {
      margin-top: 36px;
      color: var(--muted);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Personal Homepage</p>
    <h1>Guquan YOU</h1>
    <p class="subtitle">
      This is my personal homepage. Please use the email below for contact and verification purposes.
    </p>

    <section class="contact-card" aria-labelledby="contact-heading">
      <p class="label" id="contact-heading">Email</p>
      <a href="mailto:youguquan@qq.com">youguquan@qq.com</a>
    </section>

    <footer>
      © <span id="year"></span> Guquan YOU
    </footer>
  </main>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
